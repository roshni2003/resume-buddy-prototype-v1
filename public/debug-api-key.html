<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick localStorage Debug</title>
    <style>
        body {
            padding: 20px;
            font-family: monospace;
            color: #d4d4d4;
            background: #1e1e1e;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        button {
            padding: 10px 20px;
            margin: 5px;
            color: white;
            cursor: pointer;
            background: #0e639c;
            border: none;
            border-radius: 3px;
        }
        button:hover { background: #1177bb; }
        pre { 
            padding: 15px; 
            background: #252526; 
            border-left: 3px solid #0e639c;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 localStorage API Key Debugger</h1>
    <div>
        <button onclick="checkKey()">🔑 Check API Key</button>
        <button onclick="clearKey()">🗑️ Clear Key</button>
        <button onclick="testInContext()">🧪 Test in App Context</button>
    </div>
    <pre id="output">Click a button to start...</pre>

    <script>
        function log(msg, type = 'info') {
            const output = document.getElementById('output');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'warning';
            output.innerHTML += `<span class="${className}">${msg}</span>\n`;
        }

        function checkKey() {
            document.getElementById('output').innerHTML = '';
            
            // Check if localStorage is available
            if (typeof localStorage === 'undefined') {
                log('❌ localStorage is not available!', 'error');
                return;
            }
            
            log('✅ localStorage is available', 'success');
            
            // Get the key
            const key = localStorage.getItem('gemini_api_key');
            
            if (key) {
                log('✅ API Key found!', 'success');
                log(`   First 20 chars: ${key.substring(0, 20)}...`, 'success');
                log(`   Last 10 chars: ...${key.substring(key.length - 10)}`, 'success');
                log(`   Length: ${key.length} characters`, 'success');
                
                // Verify it starts with AIza
                if (key.startsWith('AIza')) {
                    log('✅ Key format looks correct (starts with AIza)', 'success');
                } else {
                    log('⚠️ Warning: Key does not start with "AIza"', 'warning');
                }
            } else {
                log('❌ No API key found in localStorage', 'error');
            }
            
            // Show all localStorage keys
            log('\n📦 All localStorage items:', 'info');
            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                log(`   ${storageKey}`, 'info');
            }
        }

        function clearKey() {
            localStorage.removeItem('gemini_api_key');
            log('🗑️ API key removed from localStorage', 'warning');
            setTimeout(checkKey, 100);
        }

        function testInContext() {
            document.getElementById('output').innerHTML = '';
            
            log('🧪 Testing API key retrieval (simulating app logic)...', 'info');
            log('', 'info');
            
            // Simulate the app's getApiKey function
            const localKey = typeof localStorage !== "undefined" ? localStorage.getItem("gemini_api_key") : null;
            
            if (localKey) {
                log('✅ Would use localStorage key:', 'success');
                log(`   ${localKey.substring(0, 20)}...`, 'success');
            } else {
                log('⚠️ No localStorage key found', 'warning');
                log('   App would fall back to environment variable', 'warning');
            }
            
            log('', 'info');
            log('🔍 What the console should show:', 'info');
            if (localKey) {
                log(`   "Using API key from localStorage: ${localKey.substring(0, 10)}..."`, 'success');
            } else {
                log('   "Using API key from environment: ..."', 'warning');
            }
        }

        // Auto-run on load
        window.addEventListener('load', checkKey);
    </script>
</body>
</html>
