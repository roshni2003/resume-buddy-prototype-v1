<!DOCTYPE html>
<html>
<head>
<style>
  .box { width: 100px; height: 100px; margin: 10px; display: inline-block; }
  .original-green { background-color: rgb(80, 200, 120); } /* Example emerald green */
  .original-black { background-color: black; }
  .inverted { filter: invert(1); }
  .hue-rotated { filter: invert(1) hue-rotate(180deg); }
  .brightened { filter: invert(1) hue-rotate(180deg) brightness(2.5); }
</style>
</head>
<body style="background: #333;">
  <div class="box original-black"></div>
  <div class="box original-green"></div>
  <br>
  <div class="box original-black inverted"></div>
  <div class="box original-green inverted"></div>
  <br>
  <div class="box original-black hue-rotated"></div>
  <div class="box original-green hue-rotated"></div>
  <br>
  <div class="box original-black brightened"></div>
  <div class="box original-green brightened"></div>
</body>
</html>
